name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  canonical:
    name: canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml .cargo/audit.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install qualification tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install zrail --git https://github.com/zsumz/zrail.git --rev 0392168aedc32f493a53e7d954684e201c882c3c --locked

      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path fuzz/Cargo.toml --locked

      - name: Run canonical gate
        run: scripts/check

  portable:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Compile and test portable behavior
        run: cargo test --workspace --all-features --locked --offline

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust 1.88
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88.0"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Test supported feature matrices
        run: |
          cargo test --workspace --all-features --locked --offline
          cargo test --workspace --no-default-features --features sha256 --locked --offline
          cargo test --workspace --no-default-features --features sha512 --locked --offline
